[package]
name = "maki-lua"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The raw `CoreHandle::fire_autocmd`, for suites that fire payloads no
# `HostEvent` carries.
test-support = ["maki-lua-core/test-support"]

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "webp", "bmp"] }
maki-agent = { workspace = true }
maki-config = { workspace = true }
maki-interpreter = { workspace = true }
maki-lua-core = { workspace = true }
maki-lua-macro = { workspace = true }
maki-pack = { workspace = true }
maki-providers = { workspace = true }
maki-types = { workspace = true }
mlua = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
include_dir = { workspace = true }
maki-storage = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
criterion = { workspace = true }
fastrand = { workspace = true }
image = { workspace = true }
jiff = { workspace = true }
maki-agent = { workspace = true }
maki-lua = { workspace = true, features = ["test-support"] }
maki-lua-core = { workspace = true, features = ["test-support"] }
maki-lua-ui = { workspace = true, features = ["test-support"] }
maki-providers = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
test-case = { workspace = true }

[[bench]]
name = "luau_perf"
harness = false

[lints]
workspace = true
